<tui-root class="root" [attr.tuiTheme]="ts.darkMode() ? 'dark' : null">
	<div class="content">
		<app-header>
			@switch (ls.headerVariant) {
				@case ("editor") {
					"editor header"
				}
				@default {
					"default header"
				}
			}
		</app-header>
		<main class="main">
			<router-outlet />
		</main>
		<app-footer>
			@switch (ls.footerVariant) {
				@case ("editor") {
					<app-footer-editor />
				}
				@default {
					<app-footer-about />
				}
			}
		</app-footer>
	</div>
</tui-root>
