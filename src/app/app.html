<tui-root class="root" [attr.tuiTheme]="ts.darkMode() ? 'dark' : null">
	<div
		class="content page-layout"
		[class.editor-layout]="ls.headerVariant === 'editor'"
	>
		<app-header>
			@switch (ls.headerVariant) {
				@case ("editor") {
					<app-header-editor />
				}
				@case ("search") {
					<div class="flex-between">
						<app-heading />
						<app-header-search />
						<div class="flex-balance"></div>
					</div>
				}
				@default {
					<app-heading />
				}
			}
		</app-header>
		@if (ls.headerVariant === "editor") {
			<app-cell-input />
		}
		<main class="main">
			<router-outlet />
		</main>
		<app-footer>
			@switch (ls.footerVariant) {
				@case ("editor") {
					<app-footer-editor />
				}
				@default {
					<app-footer-about />
				}
			}
		</app-footer>
	</div>
</tui-root>
