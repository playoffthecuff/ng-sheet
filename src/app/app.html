<tui-root class="root" [attr.tuiTheme]="ts.darkMode() ? 'dark' : null">
	<div
		class="content page-layout"
		[class.editor-layout]="ls.headerVariant === 'editor'"
	>
		<app-header>
			@switch (ls.headerVariant) {
				@case ("editor") {
					<app-header-editor />
				}
				@default {
					<div class="h-wrapper">
						<h1 tuiTitle="m" class="h shimmer">Ng Sheet</h1>
					</div>
				}
			}
		</app-header>
		@if (ls.headerVariant === "editor") {
			<app-format-vidget />
			<app-cell-input />
		}
		<main class="main">
			<router-outlet />
		</main>
		<app-footer>
			@switch (ls.footerVariant) {
				@case ("editor") {
					<app-footer-editor />
				}
				@default {
					<app-footer-about />
				}
			}
		</app-footer>
	</div>
</tui-root>
