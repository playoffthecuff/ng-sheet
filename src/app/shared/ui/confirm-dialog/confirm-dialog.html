<h2 class="tui-text_h6">{{ context.data.title }}</h2>
<p>{{ context.data.message }}</p>
<div class="buttons">
	<button
		tuiButton
		type="button"
		(click)="context.completeWith(false)"
		size="m"
		appearance="neutral"
		tuiAutoFocus
	>
		{{ context.data.cancelText ?? "Cancel" }}
	</button>
	<button
		tuiButton
		type="button"
		(click)="context.completeWith(true)"
		size="m"
		appearance="primary-grayscale"
	>
		{{ context.data.okText ?? "OK" }}
	</button>
</div>
