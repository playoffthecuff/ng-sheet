<div>
	<section class="container">
		<span class="bg">404</span>
		<article class="content">
			<h1 tuiTitle="m" class="h">Page are you looking for cannot be found</h1>
			<div class="actions-grid">
				@if (this.canGoBack) {
					<span class="txt"> You can </span>
					<button
						appearance="action"
						iconStart="@tui.undo"
						size="m"
						tuiButton
						type="button"
						(click)="goBack()"
						class="btn"
					>
						go back
					</button>
					<span class="txt">or</span>
				} @else {
					<span class="txt">You can</span>
				}
				<button
					appearance="action"
					routerLink="/"
					iconStart="@tui.home"
					size="m"
					tuiButton
					type="button"
					class="btn"
				>
					start over
				</button>
			</div>
		</article>
	</section>
	<img
		src="/assets/img/404.svg"
		alt="woman with a 'dead end' sign"
		class="img"
	/>
</div>
