<tui-textfield
	class="cell"
	tuiTextfieldSize="s"
	[tuiTextfieldCleaner]="false"
	tuiHint="Address (Ctrl + J)"
>
	<input
		#cellAddress
		placeholder="Enter cell here..."
		tuiTextfield
		class="input"
		[value]="ss.getStrAddressRange()"
		(keydown.enter)="setSelectedRange($event)"
	/>
</tui-textfield>
<tui-textfield iconStart="f-x" class="value" tuiTextfieldSize="s">
	<input
		#cellValue
		placeholder="Type value or formula here..."
		tuiTextfield
		class="input"
		(keydown.enter)="setFocusedCellValue($event)"
		[(ngModel)]="ss.userInput"
	/>
</tui-textfield>
