	[tuiHint]="data.hint"
	[appearance]="'flat'"
	tuiHintAppearance="dark"
	appearance="floating"
	tuiIconButton
	size="s"
	type="button"
	list="colors"
>
	<tui-icon [icon]="data.icon" />
</button>

<datalist id="colors">
	<option value="#800000"></option>

	<option value="#A52A2A"></option>
	<option value="#DC143C"></option>
</datalist>
