<div class="container">
	<div class="container__group" tuiItemGroup>
		@let items = baseIconsService.buttonsOptions();
		@for (item of items; track $index) {
			<button
				(click)="baseIconsService.onAction(item.action)"
				[appearance]="item.checked ? 'primary' : 'flat'"
				[tuiHint]="item.hint"
				tuiHintAppearance="dark"
				appearance="floating"
				tuiIconButton
				size="s"
				type="button"
			>
				<tui-icon [icon]="item.icon" />
			</button>
		}

		<app-color-picker
			(colorChange)="menuIconsService.updateColorPicker($event)"
			[data]="{ icon: '@tui.baseline', hint: 'Цвет текста', context: 'text' }"
		/>
		<app-color-picker
			(colorChange)="menuIconsService.updateColorPicker($event)"
			[data]="{
				icon: '@tui.paint-bucket',
				hint: 'Цвет заливки',
				context: 'field',
			}"
		/>
	</div>
</div>
